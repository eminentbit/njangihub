services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80" # host 8080 -> nginx 80 (change to "80:80" for real prod)
    env_file:
      - ./frontend/.env
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    healthcheck:
      # node-based check: node:alpine has no curl
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    command: ["npm", "start"]

  email-worker:
    build:
      context: ./backend
      dockerfile: email.worker.dockerfile
    restart: always
    env_file:
      - backend/.env
    command: ["npm", "run", "emailWorker"]

  db-worker:
    build:
      context: ./backend
      dockerfile: db.worker.dockerfile
    restart: always
    env_file:
      - backend/.env
    command: ["npm", "run", "dbWorker"]

  cronjob:
    build:
      context: ./backend
      dockerfile: cronjob.dockerfile
    restart: always
    env_file:
      - backend/.env
    command: ["npm", "run", "cronJob"]

volumes:
  backend_node_modules:
