services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # ports:
    #   - "80:80" # Expose port 80
    env_file:
      - ./frontend/.env
    # Remove the volume mount for the source code
    # volumes:
    #   - ./frontend:/app
    volumes:
      - frontend_node_modules:/app/node_modules

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    depends_on:
      - redis
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server"]

  worker:
    build:
      context: ./backend
      dockerfile: worker.dockerfile
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - redis
    restart: always
    command: ["node", "bullMQ/workers/emailWorker.js"]

  cronjob:
    build:
      context: ./backend
      dockerfile: cronjob.dockerfile
    volumes:
      - .:/app
      - /app/node_modules
    restart: always

  reverse-proxy:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  frontend_node_modules:
  backend_node_modules:
  redis_data:
